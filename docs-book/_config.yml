# Book-style site prototype built on just-the-docs.
#
# Local preview uses the gem (see Gemfile + `make jbook`). For GitHub
# Pages (actions/jekyll-build-pages) swap the `theme:` line for:
#   remote_theme: just-the-docs/just-the-docs
#   plugins: [jekyll-remote-theme, jekyll-seo-tag]

title: Advanced Integrated Circuits
description: Lectures on Advanced Integrated Circuits 2026
author: Carsten Wulff

baseurl: "/aic2026"
url: "https://wulffern.github.io"

theme: just-the-docs

# book feel: chapter list in the sidebar, search across all of it
search_enabled: true
search:
  heading_level: 2
  preview_words: 20

heading_anchors: true

aux_links:
  "PDF book":
    - "/aic2026/assets/aic.pdf"
  "GitHub":
    - "https://github.com/wulffern/aic2026"

nav_external_links:
  - title: analogicus.com
    url: https://analogicus.com

callouts:
  note:
    title: Note
    color: blue

# the chapters live in a subdirectory
include: ["chapters"]

footer_content: "Carsten Wulff 2026 &mdash; CC BY-SA 4.0"
