<button id="wide-toggle" class="header-btn btn-reset"
        aria-label="Full screen reading" aria-pressed="false"
        title="Full screen, no sidebar (f)">
  <svg class="wide-toggle-in" viewBox="0 0 16 16" width="1em" height="1em"
       fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" aria-hidden="true">
    <path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4" />
  </svg>
  <svg class="wide-toggle-out" viewBox="0 0 16 16" width="1em" height="1em"
       fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" aria-hidden="true">
    <path d="M2 6h4V2M14 6h-4V2M2 10h4v4M14 10h-4v4" />
  </svg>
</button>

<button id="theme-toggle" class="header-btn theme-toggle btn-reset"
        aria-label="Toggle dark mode" title="Toggle dark mode">
  <span class="theme-toggle-dark" aria-hidden="true">&#x1F319;</span>
  <span class="theme-toggle-light" aria-hidden="true">&#x2600;&#xFE0F;</span>
</button>
