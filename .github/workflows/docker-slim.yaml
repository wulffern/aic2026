name: CI image slim

# Builds the experimental slim TeX image (docker/Dockerfile.slim) to the
# 2026_slim tag and then proves it by running the actual builds inside it:
# lecture conversion, one standalone chapter, the book PDF + EPUB, and a
# TikZ figure. Manual only — the production workflows stay on 2026_latest
# until a run of this has passed and they are switched deliberately.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'docker/Dockerfile.slim'
      - '.github/workflows/docker-slim.yaml'

concurrency:
  group: docker-slim
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.slim
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aic:2026_slim

  # The proof: everything the real Docs/TikZ workflows do, in one job.
  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/aic:2026_slim
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Prepare sources
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make prepare-docs

      - name: Standalone chapter
        shell: bash
        run: make standalone-list FILES="l03_refbias"

      - name: Book PDF and EPUB
        shell: bash
        run: make book-pdf book-epub

      - name: TikZ figure
        shell: bash
        run: make tikz-one FNAME=l3_bjtonly

      - name: Upload proof artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slim-proof
          path: |
            docs/assets/l03_refbias.pdf
            docs/assets/aic.pdf
            docs/assets/aic.epub
          if-no-files-found: error
