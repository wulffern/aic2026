name: TikZ figures

# Runs on every branch, not just main: the review loop in
# tikz_translation_plan.md depends on being able to push a draft figure and
# see it built before the lecture reference is switched.
# No paths filter: a push touching tikz/ and Makefile was silently skipped
# once, and an unexplained miss is worse than a ~90s no-op run.
# Check-only: figure PDFs/SVGs are no longer committed back - the Docs
# workflow builds them itself (make tikz-cached in the prepare job). This
# job exists so a broken figure fails fast and a TeX-less author still
# gets rendered previews from the artifact below.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tikz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  figures:
    runs-on: ubuntu-latest
    # The repo's own image (see docker.yaml): TeX Live 2022 with poppler etc.
    # preinstalled, pulled from GHCR which is co-located with the runners.
    container:
      image: ghcr.io/wulffern/aic:2026_slim
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # pdflatex runs with -halt-on-error, so a figure that stops compiling
      # fails the job here.
      - name: Build figures
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make tikz

      - name: Render figure previews
        shell: bash
        run: make tikz-preview

      - name: Upload figure previews
        uses: actions/upload-artifact@v7
        with:
          name: tikz-previews
          path: preview
          if-no-files-found: error
