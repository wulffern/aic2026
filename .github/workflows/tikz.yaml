name: TikZ figures

# Runs on every branch, not just main: the review loop in
# tikz_translation_plan.md depends on being able to push a draft figure and
# see it built before the lecture reference is switched.
on:
  push:
    paths:
      - 'tikz/**.tex'
      - 'Makefile'
      - '.github/workflows/tikz.yaml'
  pull_request:
    paths:
      - 'tikz/**.tex'
      - 'Makefile'
      - '.github/workflows/tikz.yaml'
  workflow_dispatch:

concurrency:
  group: tikz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2022-historic
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install preview dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y poppler-utils

      # pdflatex runs with -halt-on-error, so a figure that stops compiling
      # fails the job here.
      - name: Build figures
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make tikz

      - name: Render figure previews
        shell: bash
        run: make tikz-preview

      - name: Upload figure previews
        uses: actions/upload-artifact@v4
        with:
          name: tikz-previews
          path: preview
          if-no-files-found: error

      # Commit the generated PDFs so a figure can be authored without a local
      # TeX install. Only on push — a pull_request checkout is a merge commit
      # and has no branch to push back to.
      - name: Commit generated figures
        if: github.event_name == 'push'
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find media -name '*_tikz.pdf' -print0 | xargs -0 --no-run-if-empty git add --

          if git diff --cached --quiet; then
            echo "Figures unchanged, nothing to commit."
            exit 0
          fi

          git diff --cached --name-only
          git commit -m "Rebuild TikZ figures [skip ci]"
          # Non-force: if the branch moved while this ran, fail rather than
          # clobber it. Re-running the workflow is the fix.
          git push origin "HEAD:refs/heads/${BRANCH}"
