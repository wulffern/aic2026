# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Docs

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'lectures/**.md'
      - 'docs/*.*'
      - 'media/*.*'
      - 'pdf/*.*'
      - '**.md'
      - '**.py'
      - 'Makefile'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    container:
      image: wulffern/aic:2025_latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare sources
        shell: bash
        run: |
          git config --global --add safe.directory $(pwd)
          make version posts-parallel texfiles-parallel
          cd pdf && git clone https://github.com/fmarotta/kaobook.git
      - name: Standalone PDFs (parallel)
        shell: bash
        run: make standalone-parallel
      - name: Book PDF and EBook
        shell: bash
        run: |
          (cd pdf && make one && cp aic.pdf ../docs/assets/) &
          (cd pdf && make ebook && cp aic.epub ../docs/assets/) &
          wait
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3


  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
