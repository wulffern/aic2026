name: Docs

on:
  push:
    branches: ["main"]
    # Scoped to what the build actually reads: a push that only touches a
    # planning document at the repo root should not cost a full site build.
    paths:
      - 'lectures/**'
      - 'docs/**'
      - 'media/**'
      - 'pdf/**'
      - 'tikz/**.tex'
      - 'py/**'
      - 'ex/**'
      - 'examples/**'
      - 'slides/**'
      - 'jupyter/**'
      - 'Makefile'
      - 'requirements-ci.txt'
      - 'syllabus.md'
      - 'plan.md'
      - 'downloads.md'
      - 'version'
      - '.github/workflows/matrix_build.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # Which site to publish: 'book' is the just-the-docs site assembled
  # from docs-book/ by py/mkbooksite.py; 'legacy' is the old minima site
  # in docs/. Flip this one line to roll back.
  SITE_FLAVOR: book

# All build jobs run in the repo's own image (see docker.yaml): TeX Live 2022
# plus every apt and pip dependency preinstalled. Before this, each job
# pulled texlive/texlive from docker.io and re-ran apt-get install, which was
# about half the runner-minutes of a run.

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wulffern/aic:2026_slim
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Rolling cache, same scheme as the standalone shards: restore the
      # newest snapshot, save a fresh one under a unique key. Hits are
      # decided per figure inside py/tikzcache.py on a content hash.
      - name: Restore TikZ figure cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/aic-tikz
          key: tikz-figures-${{ github.run_id }}
          restore-keys: |
            tikz-figures-

      # The generated figures are not committed; build them before
      # prepare-docs copies media/ into pdf/media and docs/assets/media.
      - name: Build TikZ figures
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make tikz-cached

      - name: Save TikZ figure cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/aic-tikz
          key: tikz-figures-${{ github.run_id }}

      - name: Prepare shared sources
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make prepare-docs

      - name: Upload prepared sources
        uses: actions/upload-artifact@v7
        with:
          name: prepared-sources
          path: |
            docs/_posts
            docs/assets/media
            docs/assets/html
            docs/assets/examples
            docs/downloads.md
            docs/plan.md
            docs/syllabus.md
            pdf
            !pdf/*.aux
            !pdf/*.log
            !pdf/*.pdf
            !pdf/*.epub
            !pdf/*.bbl
            !pdf/*.blg
            !pdf/*.toc
            !pdf/*.bcf
            !pdf/*.xml
            !pdf/*.mw
            version
          if-no-files-found: error

  plan_matrix:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Generate shard matrix from Makefile
        id: shards
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import math
          import subprocess

          files = [line.strip() for line in subprocess.check_output(["make", "print-files"], text=True).splitlines() if line.strip()]
          shard_count = 4
          shard_size = math.ceil(len(files) / shard_count)
          shards = []
          for idx in range(shard_count):
            group = files[idx * shard_size:(idx + 1) * shard_size]
            if not group:
              continue
            shards.append({
              "shard": f"core-{idx + 1}",
              "files": " ".join(group),
            })
          print(f"shards={json.dumps(shards)}")
          PY

  standalone:
    needs:
      - prepare
      - plan_matrix
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wulffern/aic:2026_slim
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan_matrix.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v8
        with:
          name: prepared-sources
          path: .

      # Rolling cache: restore the newest snapshot for this shard, save a
      # fresh one under a unique key. Hits are decided per chapter inside
      # py/pdfcache.py on a content hash, not by this key.
      - name: Restore standalone PDF cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/aic-standalone
          key: standalone-pdf-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            standalone-pdf-${{ matrix.shard }}-

      - name: Build standalone shard
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make standalone-cached FILES="${{ matrix.files }}"

      - name: Save standalone PDF cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/aic-standalone
          key: standalone-pdf-${{ matrix.shard }}-${{ github.run_id }}

      - name: Package standalone shard
        shell: bash
        run: |
          mkdir -p artifact/docs/assets
          for f in ${{ matrix.files }}; do
            cp "docs/assets/${f}.pdf" artifact/docs/assets/
          done

      - name: Upload standalone shard
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.shard }}
          path: artifact/docs/assets
          if-no-files-found: error

  # PDF and EPUB in one job: the EPUB is 11s of pandoc, not worth its own
  # container spin-up.
  book:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wulffern/aic:2026_slim
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v8
        with:
          name: prepared-sources
          path: .

      - name: Build book PDF and EPUB
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make book-pdf book-epub

      - name: Package book
        shell: bash
        run: |
          mkdir -p artifact/docs/assets
          cp docs/assets/aic.pdf docs/assets/aic.epub docs/assets/aic_ai.pdf artifact/docs/assets/

      - name: Upload book
        uses: actions/upload-artifact@v7
        with:
          name: book
          path: artifact/docs/assets
          if-no-files-found: error

  jekyll_preview:
    needs:
      - prepare
      - standalone
      - book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v8
        with:
          name: prepared-sources
          path: .

      - name: Download standalone PDFs
        uses: actions/download-artifact@v8
        with:
          pattern: standalone-*
          merge-multiple: true
          path: docs/assets

      - name: Download book
        uses: actions/download-artifact@v8
        with:
          name: book
          path: docs/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ---- book site (just-the-docs), theme pinned by Gemfile.lock ----
      - name: Generate book site sources
        if: env.SITE_FLAVOR == 'book'
        run: python3 py/mkbooksite.py

      - name: Setup Ruby
        if: env.SITE_FLAVOR == 'book'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs-book

      - name: Build with Jekyll (book)
        if: env.SITE_FLAVOR == 'book'
        working-directory: docs-book
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build -d ../_site

      # ---- legacy site (minima in docs/), kept for easy rollback ----
      - name: Build with Jekyll (legacy)
        if: env.SITE_FLAVOR == 'legacy'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: jekyll_preview
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
