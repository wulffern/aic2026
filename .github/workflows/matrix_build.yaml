name: Docs Artifact Parallel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-artifact-parallel"
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install prepare dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils wget imagemagick ghostscript
          python -m pip install --upgrade pip
          python -m pip install click svglib numpy pandas matplotlib

      - name: Prepare shared sources
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make prepare-docs

      - name: Upload prepared sources
        uses: actions/upload-artifact@v4
        with:
          name: prepared-sources
          path: |
            docs/_posts
            docs/assets/media
            docs/downloads.md
            docs/plan.md
            docs/syllabus.md
            pdf
            version
          if-no-files-found: error

  standalone:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: wulffern/aic:2025_latest
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-1
            files: "l00_jayn l01_intro lr0_excellence l00_refresher l00_diode lr0_mosfet lr0_circuits lr0_passives"
          - shard: core-2
            files: "lr0_noise lr0_tools lr0_tut1 l01_project l02_esd l03_refbias l04_afe l04_dac"
          - shard: core-3
            files: "l05_sc l06_adc l07_vreg l08_pll l09_osc l10_lpradio lx_energysrc l11_aver"
          - shard: core-4
            files: "lp_project_report lr0_layout l13_thoughts l00_spice l00_sv l00_ades lr0_logic l00_questions"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v4
        with:
          name: prepared-sources
          path: .

      - name: Build standalone shard
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make standalone-list FILES="${{ matrix.files }}"

      - name: Package standalone shard
        shell: bash
        run: |
          mkdir -p artifact/docs/assets
          for f in ${{ matrix.files }}; do
            cp "docs/assets/${f}.pdf" artifact/docs/assets/
          done

      - name: Upload standalone shard
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.shard }}
          path: artifact/docs/assets
          if-no-files-found: error

  book_pdf:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: wulffern/aic:2025_latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v4
        with:
          name: prepared-sources
          path: .

      - name: Build book PDF
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make book-pdf

      - name: Package book PDF
        shell: bash
        run: |
          mkdir -p artifact/docs/assets
          cp docs/assets/aic.pdf artifact/docs/assets/

      - name: Upload book PDF
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: artifact/docs/assets
          if-no-files-found: error

  epub:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: wulffern/aic:2025_latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v4
        with:
          name: prepared-sources
          path: .

      - name: Build EPUB
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make book-epub

      - name: Package EPUB
        shell: bash
        run: |
          mkdir -p artifact/docs/assets
          cp docs/assets/aic.epub artifact/docs/assets/

      - name: Upload EPUB
        uses: actions/upload-artifact@v4
        with:
          name: book-epub
          path: artifact/docs/assets
          if-no-files-found: error

  jekyll_preview:
    needs:
      - prepare
      - standalone
      - book_pdf
      - epub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v4
        with:
          name: prepared-sources
          path: .

      - name: Download standalone PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          merge-multiple: true
          path: .

      - name: Download book PDF
        uses: actions/download-artifact@v4
        with:
          name: book-pdf
          path: .

      - name: Download EPUB
        uses: actions/download-artifact@v4
        with:
          name: book-epub
          path: .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/
          destination: ./_site

      - name: Upload preview site
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-preview-site
          path: _site
          if-no-files-found: error
