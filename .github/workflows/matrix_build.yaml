name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - 'lectures/**.md'
      - 'docs/*.*'
      - 'media/*.*'
      - 'pdf/*.*'
      - 'tikz/**.tex'
      - '**.md'
      - '**.py'
      - 'Makefile'
      - 'requirements-ci.txt'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install prepare dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils wget imagemagick ghostscript \
            build-essential pkg-config libcairo2-dev python3-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Prepare shared sources
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make prepare-docs

      - name: Upload prepared sources
        uses: actions/upload-artifact@v4
        with:
          name: prepared-sources
          path: |
            docs/_posts
            docs/assets/media
            docs/assets/html
            docs/assets/examples
            docs/downloads.md
            docs/plan.md
            docs/syllabus.md
            pdf
            !pdf/*.aux
            !pdf/*.log
            !pdf/*.pdf
            !pdf/*.epub
            !pdf/*.bbl
            !pdf/*.blg
            !pdf/*.toc
            !pdf/*.bcf
            !pdf/*.xml
            !pdf/*.mw
            version
          if-no-files-found: error

  plan_matrix:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate shard matrix from Makefile
        id: shards
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import math
          import subprocess

          files = [line.strip() for line in subprocess.check_output(["make", "print-files"], text=True).splitlines() if line.strip()]
          shard_count = 4
          shard_size = math.ceil(len(files) / shard_count)
          shards = []
          for idx in range(shard_count):
            group = files[idx * shard_size:(idx + 1) * shard_size]
            if not group:
              continue
            shards.append({
              "shard": f"core-{idx + 1}",
              "files": " ".join(group),
            })
          print(f"shards={json.dumps(shards)}")
          PY

  standalone:
    needs:
      - prepare
      - plan_matrix
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2022-historic
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan_matrix.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v4
        with:
          name: prepared-sources
          path: .

      - name: Install TeX job dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y ghostscript poppler-utils pandoc wget imagemagick python3-svglib python3-venv

      - name: Build standalone shard
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make standalone-list FILES="${{ matrix.files }}"

      - name: Package standalone shard
        shell: bash
        run: |
          mkdir -p artifact/docs/assets
          for f in ${{ matrix.files }}; do
            cp "docs/assets/${f}.pdf" artifact/docs/assets/
          done

      - name: Upload standalone shard
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.shard }}
          path: artifact/docs/assets
          if-no-files-found: error

  book_pdf:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2022-historic
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v4
        with:
          name: prepared-sources
          path: .

      - name: Install TeX job dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y ghostscript poppler-utils pandoc wget imagemagick python3-svglib python3-venv

      - name: Build book PDF
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make book-pdf

      - name: Package book PDF
        shell: bash
        run: |
          mkdir -p artifact/docs/assets
          cp docs/assets/aic.pdf artifact/docs/assets/

      - name: Upload book PDF
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: artifact/docs/assets
          if-no-files-found: error

  epub:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2022-historic
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v4
        with:
          name: prepared-sources
          path: .

      - name: Install TeX job dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y ghostscript poppler-utils pandoc wget imagemagick python3-svglib python3-venv

      - name: Build EPUB
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          make book-epub

      - name: Package EPUB
        shell: bash
        run: |
          mkdir -p artifact/docs/assets
          cp docs/assets/aic.epub artifact/docs/assets/

      - name: Upload EPUB
        uses: actions/upload-artifact@v4
        with:
          name: book-epub
          path: artifact/docs/assets
          if-no-files-found: error

  jekyll_preview:
    needs:
      - prepare
      - standalone
      - book_pdf
      - epub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prepared sources
        uses: actions/download-artifact@v4
        with:
          name: prepared-sources
          path: .

      - name: Download standalone PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          merge-multiple: true
          path: docs/assets

      - name: Download book PDF
        uses: actions/download-artifact@v4
        with:
          name: book-pdf
          path: docs/assets

      - name: Download EPUB
        uses: actions/download-artifact@v4
        with:
          name: book-epub
          path: docs/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: jekyll_preview
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
